# Beispiel für einen VORHANDENEN nginx auf dem Server (Variante B).
# Datei z. B. als /etc/nginx/sites-available/warevision-quadparadies anlegen,
# Domain und Port (HTTP_PORT aus der .env) anpassen, dann:
#   sudo ln -s /etc/nginx/sites-available/warevision-quadparadies /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d quadparadies.warevision.de      (https-Zertifikat, Let's Encrypt)

server {
    listen 80;
    server_name quadparadies.warevision.de;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
