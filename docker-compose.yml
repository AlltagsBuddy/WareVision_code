services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: warevision
      POSTGRES_PASSWORD: warevision
      POSTGRES_DB: warevision
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warevision"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://warevision:warevision@postgres:5432/warevision
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      UPLOAD_DIR: /app/uploads
      # SENTRY_DSN: "https://xxx@sentry.io/yyy"  # Sentry Fehler-Tracking (optional)
      # CORS_ORIGINS_EXTRA: "http://192.168.1.100:5173,https://test.warevision.de"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info -Q celery --concurrency=2
    environment:
      DATABASE_URL: postgresql://warevision:warevision@postgres:5432/warevision
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: ./backend
    command: celery -A app.worker.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://warevision:warevision@postgres:5432/warevision
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Backup: docker compose run backup (manuell)
  # Tägliches Backup: siehe docs/ANLEITUNG_BACKUP.md
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: warevision
      PGPASSWORD: warevision
      PGDATABASE: warevision
      BACKUP_DIR: /backups
    volumes:
      - backup_data:/backups
      - ./infra/backup/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - backup

volumes:
  postgres_data:
  uploads_data:
  backup_data:
  redis_data:
